# Local development add-on: a PostgreSQL (with pgvector) container instead of a server on the host.
#   docker compose -f compose.yaml -f compose.local.yaml up --build -d
# Creates the CRM database (POSTGRES_DB) and the knowledge database (estraos_knowledge) on first start.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estraos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-estra_os}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/local/init-knowledge-db.sql:/docker-entrypoint-initdb.d/10-knowledge.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estraos} -d ${POSTGRES_DB:-estra_os}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    depends_on:
      db:
        condition: service_healthy

  rag-migrate:
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
