name: estraos

x-rag-environment: &rag-environment
  RAG_DATABASES_JSON: ${RAG_DATABASES_JSON:?Set RAG_DATABASES_JSON in .env}
  RAG_INGESTION_TOKEN: ${RAG_INGESTION_TOKEN:?Set RAG_INGESTION_TOKEN in .env}
  RAG_STORAGE_PATH: /data/sources
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
  RAG_EMBEDDING_REVISION: ${RAG_EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
  RAG_OCR_LANGUAGES: ${RAG_OCR_LANGUAGES:-eng+hin+mar+guj}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  MISTRAL_EXTRACTION_MODEL: ${MISTRAL_EXTRACTION_MODEL:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estra_os}
      POSTGRES_USER: ${POSTGRES_USER:-estraos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-estra_os}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-estraos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      APP_DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-91}
      APP_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      APP_INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-mock}
      APP_INGESTION_URL: http://knowledge-api:8090
      APP_INGESTION_TOKEN: ${RAG_INGESTION_TOKEN:?Set RAG_INGESTION_TOKEN in .env}
      APP_INTEGRATIONS_RAG_URL: ${RAG_SERVICE_URL:-}
      APP_INTEGRATIONS_RAG_API_KEY: ${RAG_API_KEY:-}
      APP_INTEGRATIONS_VOICE_URL: ${VOICE_AGENT_SERVICE_URL:-}
      APP_INTEGRATIONS_VOICE_API_KEY: ${VOICE_AGENT_API_KEY:-}
      APP_INTEGRATIONS_NOTIFICATION_URL: ${NOTIFICATION_SERVICE_URL:-}
      APP_INTEGRATIONS_NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-}
      APP_FILES_STORAGE_PATH: /data/files
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - file-storage:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

  knowledge-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RAG_POSTGRES_DB:-estraos_knowledge}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?Set RAG_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-55432}:5432"
    volumes:
      - knowledge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  knowledge-migrate:
    build: ./rag
    command: ["migrate"]
    environment: *rag-environment
    depends_on:
      knowledge-db:
        condition: service_healthy

  knowledge-api:
    build: ./rag
    command: ["api", "--host", "0.0.0.0"]
    restart: unless-stopped
    environment: *rag-environment
    ports:
      - "127.0.0.1:${RAG_PORT:-8090}:8090"
    volumes:
      - knowledge-source-files:/data
    depends_on:
      knowledge-migrate:
        condition: service_completed_successfully

  knowledge-worker:
    build: ./rag
    command: ["worker"]
    restart: unless-stopped
    environment: *rag-environment
    volumes:
      - knowledge-source-files:/data
      - knowledge-embedding-models:/models
    depends_on:
      knowledge-migrate:
        condition: service_completed_successfully

volumes:
  crm-postgres-data:
  file-storage:
  knowledge-db-data:
  knowledge-source-files:
  knowledge-embedding-models:
