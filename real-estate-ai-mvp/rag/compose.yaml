name: estraos-rag

# Knowledge service on its own. PostgreSQL (with pgvector and pg_trgm) runs on the host.
x-rag-environment: &rag-environment
  RAG_DATABASE_URL: ${RAG_DATABASE_URL:?Set RAG_DATABASE_URL in .env}
  RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:?Set RAG_SERVICE_TOKEN in .env}
  RAG_VOICE_TOKEN: ${RAG_VOICE_TOKEN:-}
  RAG_VOICE_WORKSPACE_ID: ${RAG_VOICE_WORKSPACE_ID:-1}
  PROVIDER_MODE: ${PROVIDER_MODE:-live}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  PARSER_PROVIDER: ${PARSER_PROVIDER:-openai}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
  RERANKER: ${RERANKER:-bge}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  RERANK_BUDGET_MS: ${RERANK_BUDGET_MS:-150}
  REWRITE_ON_VOICE: ${REWRITE_ON_VOICE:-false}

services:
  rag-migrate:
    build: .
    command: ["migrate"]
    environment: *rag-environment

  rag-api:
    build: .
    command: ["api", "--host", "0.0.0.0", "--port", "8090"]
    restart: unless-stopped
    environment: *rag-environment
    ports:
      - "127.0.0.1:${RAG_PORT:-8090}:8090"
    volumes:
      - rag-sources:/data/sources
      - rag-models:/models
    depends_on:
      rag-migrate:
        condition: service_completed_successfully

  rag-worker:
    build: .
    command: ["worker"]
    restart: unless-stopped
    environment: *rag-environment
    volumes:
      - rag-sources:/data/sources
    depends_on:
      rag-migrate:
        condition: service_completed_successfully

volumes:
  rag-sources:
  rag-models:
