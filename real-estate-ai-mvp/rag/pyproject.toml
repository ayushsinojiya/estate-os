[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "estraos-rag-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7", "pypdfium2>=4,<6", "pytesseract>=0.3.13,<1",
  "openpyxl>=3.1,<4", "xlrd>=2,<3", "python-docx>=1.1,<2",
  "sentence-transformers==5.7.0", "transformers==5.17.0", "numpy==2.5.3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
estraos-rag = "rag_ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["rag_ingestion*"]

[tool.setuptools.package-data]
rag_ingestion = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires dedicated PostgreSQL database with pgvector"]
