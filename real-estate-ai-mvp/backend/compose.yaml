name: estraos-backend

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-estra_os}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-estraos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${JWT_SECRET:?Set a 32+ byte JWT_SECRET in .env}
      APP_DEMO_PASSWORD: ${DEMO_PASSWORD:?Set a 12+ character DEMO_PASSWORD in .env}
      APP_CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-91}
      APP_INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-mock}
      APP_INGESTION_URL: ${RAG_INGESTION_URL:-http://host.docker.internal:8090}
      APP_INGESTION_TOKEN: ${RAG_INGESTION_TOKEN:-}
      APP_INTEGRATIONS_RAG_URL: ${RAG_SERVICE_URL:-}
      APP_INTEGRATIONS_RAG_API_KEY: ${RAG_API_KEY:-}
      APP_INTEGRATIONS_VOICE_URL: ${VOICE_AGENT_SERVICE_URL:-}
      APP_INTEGRATIONS_VOICE_API_KEY: ${VOICE_AGENT_API_KEY:-}
      APP_INTEGRATIONS_NOTIFICATION_URL: ${NOTIFICATION_SERVICE_URL:-}
      APP_INTEGRATIONS_NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-}
      APP_FILES_STORAGE_PATH: /data/files
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - file-storage:/data/files
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  file-storage:
