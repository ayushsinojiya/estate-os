name: estraos

x-rag-environment: &rag-environment
  RAG_DATABASE_URL: ${RAG_DATABASE_URL:?Set RAG_DATABASE_URL in .env}
  RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:?Set RAG_SERVICE_TOKEN in .env}
  RAG_VOICE_TOKEN: ${RAG_VOICE_TOKEN:-}
  RAG_VOICE_WORKSPACE_ID: ${RAG_VOICE_WORKSPACE_ID:-1}
  PROVIDER_MODE: ${RAG_PROVIDER_MODE:-live}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  PARSER_PROVIDER: ${PARSER_PROVIDER:-openai}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
  RERANKER: ${RERANKER:-bge}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  RERANK_BUDGET_MS: ${RERANK_BUDGET_MS:-150}
  REWRITE_ON_VOICE: ${REWRITE_ON_VOICE:-false}

services:
  api:
    build: ./real-estate-ai-mvp/backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-estra_os}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-estraos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      APP_DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-91}
      APP_CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-mock}
      # The knowledge service is used for real whenever this URL is set (even in mock mode).
      APP_INTEGRATIONS_RAG_URL: ${RAG_SERVICE_URL:-http://rag-api:8090}
      APP_INTEGRATIONS_RAG_API_KEY: ${RAG_SERVICE_TOKEN:?Set RAG_SERVICE_TOKEN in .env}
      APP_INTEGRATIONS_VOICE_URL: ${VOICE_AGENT_SERVICE_URL:-}
      APP_INTEGRATIONS_VOICE_API_KEY: ${VOICE_AGENT_API_KEY:-}
      APP_INTEGRATIONS_NOTIFICATION_URL: ${NOTIFICATION_SERVICE_URL:-}
      APP_INTEGRATIONS_NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-}
      APP_FILES_STORAGE_PATH: /data/files
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - file-storage:/data/files
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./real-estate-ai-mvp/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

  rag-migrate:
    build: ./real-estate-ai-mvp/rag
    command: ["migrate"]
    environment: *rag-environment

  rag-api:
    build: ./real-estate-ai-mvp/rag
    command: ["api", "--host", "0.0.0.0", "--port", "8090"]
    restart: unless-stopped
    environment: *rag-environment
    ports:
      - "127.0.0.1:${RAG_PORT:-8090}:8090"
    volumes:
      - rag-sources:/data/sources
      - rag-models:/models
    depends_on:
      rag-migrate:
        condition: service_completed_successfully

  rag-worker:
    build: ./real-estate-ai-mvp/rag
    command: ["worker"]
    restart: unless-stopped
    environment: *rag-environment
    volumes:
      - rag-sources:/data/sources
    depends_on:
      rag-migrate:
        condition: service_completed_successfully

volumes:
  file-storage:
  rag-sources:
  rag-models:
